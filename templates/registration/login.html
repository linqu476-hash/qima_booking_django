{% extends 'base.html' %}{% block title %}Sign in · QIMA Booking{% endblock %}{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4"><div class="card p-4"><h1 class="h3 mb-1">Welcome back</h1><p class="muted mb-4">Sign in to manage QIMA booking runs.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div><div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100">Sign in</button></form></div></div></div><script>document.querySelectorAll('input').forEach(e=>e.classList.add('form-control'))</script>{% endblock %}
