<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}QIMA Booking{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb;color:#182235}.navbar{background:#14213d}.card{border:0;box-shadow:0 5px 20px #1725540c;border-radius:14px}.brand{font-weight:800;letter-spacing:.2px}.muted{color:#64748b}</style></head><body><nav class="navbar navbar-dark mb-4"><div class="container"><a class="navbar-brand brand" href="{% url 'dashboard' %}">QIMA Booking</a>{% if user.is_authenticated %}<div class="d-flex align-items-center gap-3 text-white"><span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Sign out</button></form></div>{% endif %}</div></nav><main class="container pb-5">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
