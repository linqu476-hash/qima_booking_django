services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - qima-data:/app/data
      - qima-uploads:/app/data/uploads
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - qima-data:/app/data
      - qima-uploads:/app/data/uploads
    command: python manage.py run_booking_worker --poll-seconds 2
    depends_on: [web]
volumes:
  qima-data:
  qima-uploads:
